<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0d1117"><title>Atlas Observer</title><link rel="stylesheet" href="/styles.css"></head><body><div id="app" class="handheld"><header class="console-top"><div class="brand-mark">A</div><div class="console-title"><strong>ATLAS</strong><span>OBSERVER</span></div><div class="console-led"></div></header><main class="screen-frame"><div class="screen-bezel"><div class="screen-glow"><div class="screen-reflection"></div><div class="browser-bar"><div class="address-bar"><span class="lock">◆</span><span id="address">atlas://overview</span></div><button id="refresh" class="icon-button">↻</button></div><section id="game-panel" class="game-panel">
