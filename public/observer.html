<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117"><title>Atlas</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
</head>
<body>
<div id="app" class="handheld">
<header class="console-top"><div class="brand-mark">A</div><div class="console-title"><strong>ATLAS</strong><span>HANDHELD</span></div><div class="console-led"></div></header>
<main class="screen-frame">
  <div class="screen-bezel">
    <div class="screen-glow">
      <section id="game-panel" class="game-panel">
        <div class="game-panel-head"><div><strong>ATLAS WORLD</strong><span>LIVE WORLD GRAPHICS · ROOT CLIMATE</span></div><span id="game-status" class="game-status">LOADING…</span></div>
        <div class="game-board-wrap"><div id="game-board" class="game-board"></div></div>
        <div id="game-panel-stats" class="game-panel-stats"></div>
      </section>

      <section id="game-vision" class="game-vision" aria-label="Vision"></section>
      <section id="info-panel" class="info-panel" aria-label="Observer information">
        <div id="site" class="site"></div>
        <nav class="cartridge-dock">
          <button class="tab active" data-site="world"><span>◎</span><b>World</b></button>
          <button class="tab" data-site="map"><span>◇</span><b>Map</b></button>
          <button class="tab" data-site="inspector"><span>⌖</span><b>Inspect</b></button>
          <button class="tab" data-site="systems"><span>≋</span><b>Systems</b></button>
        </nav>
      </section>
    </div>
  </div>
</main>

<section class="controller">
  <div class="dpad"><button class="dpad-up" data-direction="up">▲</button><button class="dpad-left" data-direction="left">◀</button><span></span><button class="dpad-right" data-direction="right">▶</button><button class="dpad-down" data-direction="down">▼</button></div>
  <div class="console-center"><div class="system-buttons"><button data-action="select">SELECT</button><button data-action="start">START</button></div><span id="app-mode-label" class="small">OBSERVER</span><strong>DEV UNIT</strong></div>
  <div class="action-buttons"><button type="button" aria-label="A button">A</button><button type="button" aria-label="B button">B</button></div>
</section>
  <section class="controller">
  <div class="dpad"><button class="dpad-up" data-direction="up">▲</button><button class="dpad-left" data-direction="left">◀</button><span></span><button class="dpad-right" data-direction="right">▶</button><button class="dpad-down" data-direction="down">▼</button></div>
  <div class="console-center"><div class="system-buttons"><button data-action="select">SELECT</button><button data-action="start">START</button></div><span id="app-mode-label" class="small">OBSERVER</span><strong>DEV UNIT</strong></div>
  <div class="action-buttons"><button type="button" aria-label="A button">A</button><button type="button" aria-label="B button">B</button></div>
</section>
  </div>
</div>
<script type="module" src="/app.js"></script>
</body></html>
